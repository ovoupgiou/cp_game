<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolhead Arcade</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:radial-gradient(circle at 50% 35%,#17181d,#050506 80%);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
.s{position:fixed;left:-20%;width:140%;height:3px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--c),transparent) 0 0/28% 100% no-repeat,linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 40%,transparent),transparent);filter:drop-shadow(0 0 6px var(--c));animation:sw 5s ease-in-out infinite alternate}
@keyframes sw{to{background-position:100% 0,0 0}}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px}
h1{margin:0;font-size:clamp(30px,9vw,44px);font-weight:800;letter-spacing:-.5px}
.g{background:linear-gradient(90deg,#3b6cff,#7aa7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#sub{margin:0 0 8px;color:#c3c7d0;font-size:16px}
.card{display:flex;align-items:center;gap:16px;width:min(100%,360px);box-sizing:border-box;padding:16px;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;text-decoration:none;text-align:left}
.card:active{transform:scale(.98);border-color:#3b6cff;box-shadow:0 0 24px rgba(59,108,255,.45)}
.card svg{width:64px;height:64px;flex:none}
.card b{display:block;font-size:19px;margin-bottom:3px}
.card span{font-size:14px;line-height:1.35;color:#c3c7d0}
#rule{width:min(100%,360px);box-sizing:border-box;padding:10px 14px;border-radius:14px;border:1px solid rgba(255,201,51,.5);background:rgba(255,201,51,.1);color:#ffe08a;font-size:14px;line-height:1.4}
#menu{overflow-y:auto;justify-content:safe center}
</style></head><body>
<i class="s" style="top:14%;transform:rotate(-7deg);--c:#3b6cff;animation-duration:4.6s;animation-delay:0s"></i>
<i class="s" style="top:38%;transform:rotate(6deg);--c:#ff8a2b;animation-duration:5.4s;animation-delay:-1.5s"></i>
<i class="s" style="top:66%;transform:rotate(-5deg);--c:#19c7b8;animation-duration:6.2s;animation-delay:-3s"></i>
<i class="s" style="top:86%;transform:rotate(5deg);--c:#a64bff;animation-duration:5s;animation-delay:-2s"></i>
<div id="menu"></div>
<script>
const T={en:{s:'Pick a game',n:['Catch the Toolhead','Layer by Layer','Leaderboard'],d:['Catch as many toolheads as you can in 15 seconds. Dodge the red balls, grab the golden ones.','Tap to stack printed layers as high as you can.','See the top players of both games.']}};
const U=['toolhead-yakala.html','layer-by-layer.html','leaderboard.html'];
const I=[`<svg viewBox="0 0 64 64" stroke="#fff" stroke-width="3" stroke-linejoin="round"><rect x="20" y="6" width="24" height="40" rx="7" fill="#16161a"/><rect x="25" y="38" width="14" height="3" fill="#3b6cff" stroke="none"/><rect x="26" y="15" width="12" height="3" fill="#8a8f99" stroke="none"/><rect x="12" y="54" width="40" height="6" rx="3" fill="#d8dbe2"/></svg>`,
`<svg viewBox="0 0 64 64" stroke="#fff" stroke-width="3" stroke-linejoin="round"><rect x="14" y="46" width="36" height="10" fill="#3b6cff"/><rect x="17" y="36" width="32" height="10" fill="#ff8a2b"/><rect x="17" y="26" width="28" height="10" fill="#19c7b8"/><rect x="20" y="16" width="24" height="10" fill="#a64bff"/></svg>`,
`<svg viewBox="0 0 64 64" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M20 8h24v14a12 12 0 0 1-24 0z" fill="#ffc933"/><path d="M20 12h-8c0 10 4 14 10 14M44 12h8c0 10-4 14-10 14M32 34v10" fill="none"/><rect x="22" y="44" width="20" height="8" rx="2" fill="#ffc933"/><rect x="18" y="52" width="28" height="6" rx="2" fill="#d8dbe2"/></svg>`];
let L='en';const menu=document.getElementById('menu');
function render(){const t=T[L];menu.innerHTML='<h1>Toolhead <span class="g">Arcade</span></h1><p id="sub">'+t.s+'</p><div id="rule">🎁 <b>Prize draw:</b> score at least <b>20</b> in one of the two games to enter.</div>'+[0,1,2].map(i=>'<a class="card" href="'+U[i]+'">'+I[i]+'<div><b>'+t.n[i]+'</b><span>'+t.d[i]+'</span></div></a>').join('')}
render();
</script></body></html>
