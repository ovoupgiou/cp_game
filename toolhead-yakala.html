<style>

<script>

function glow(t){x.lineCap='round';S.forEach(([c,a,b,d,e],i)=>{const u=(t*(.2+.05*i)+i*.37)%2,p=u<1?u:2-u,P=[[-.1*W,a*H],[.3*W,b*H],[.6*W,d*H],[1.1*W,e*H]];
const pt=s=>{const m=1-s;return[0,1].map(k=>m*m*m*P[0][k]+3*m*m*s*P[1][k]+3*m*s*s*P[2][k]+s*s*s*P[3][k])};
const s0=Math.max(0,p-.12),s1=Math.min(1,p+.12);
for(const[w,al]of[[12,.18],[5,.9]]){x.beginPath();for(let k=0;k<=14;k++){const q=pt(s0+(s1-s0)*k/14);k?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])}x.strokeStyle=c;x.globalAlpha=al;x.lineWidth=w;x.stroke()}x.globalAlpha=1})}
function idle(n){if(run){idleOn=false;return}x.drawImage(oc,0,0,W,H);glow(n/1000);requestAnimationFrame(idle)}
const T={en:{t:'Catch the <span class="g">Toolhead</span>',d:'Catch as many toolheads as you can in 15 seconds.<br>Drag your finger to move the bed.<br>Avoid the red X balls, they cost you 2 points!<br>Golden toolheads count double!',s:'Start',w:'You did it! 🎉',l:'Time’s up',c:n=>'Your score: '+n,r:'Try again!',p:'Play again'}};
const PR=`<svg viewBox="0 0 220 150" stroke="#fff" stroke-width="3" stroke-linejoin="round"><rect x="30" y="118" width="160" height="22" rx="8" fill="#e6e8ec"/><rect x="44" y="20" width="10" height="98" rx="3" fill="#cfd3da"/><rect x="166" y="20" width="10" height="98" rx="3" fill="#cfd3da"/><rect x="40" y="12" width="140" height="12" rx="4" fill="#cfd3da"/><circle cx="26" cy="62" r="16" fill="#3b6cff"/><circle cx="194" cy="62" r="16" fill="#ff8a2b"/><circle cx="26" cy="62" r="4" fill="#0a0a0b"/><circle cx="194" cy="62" r="4" fill="#0a0a0b"/><rect x="54" y="46" width="112" height="9" rx="3" fill="#cfd3da"/><rect x="48" y="112" width="124" height="8" rx="3" fill="#9aa0ab"/><g stroke-width="2.5"><path d="M82 88l28 12v14l-28-12z" fill="#3b6cff"/><path d="M110 100l28-12v14l-28 12z" fill="#e8453c"/><path d="M110 76l28 12-28 12-28-12z" fill="#ffc933"/></g><g fill="#16161a"><rect x="60" y="40" width="16" height="34" rx="5"/><rect x="84" y="40" width="16" height="34" rx="5"/><rect x="120" y="40" width="16" height="34" rx="5"/><rect x="144" y="40" width="16" height="34" rx="5"/></g><g stroke="none"><rect x="63" y="68" width="10" height="3" fill="#3b6cff"/><rect x="87" y="68" width="10" height="3" fill="#ff8a2b"/><rect x="123" y="68" width="10" height="3" fill="#19c7b8"/><rect x="147" y="68" width="10" height="3" fill="#a64bff"/></g></svg>`;
let run=false,items=[],caught=0,left=TIME,px=0,spawn=0,last=0,fl=0,mode=0,idleOn=false,W,H,D,oc;
let L='en';
const cv=document.getElementById('c'),x=cv.getContext('2d'),ov=document.getElementById('ov'),sc=document.getElementById('sc'),tm=document.getElementById('tm');
function bg(){oc=document.createElement('canvas');oc.width=W*D;oc.height=H*D;const o=oc.getContext('2d');o.scale(D,D);
const g=o.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H));g.addColorStop(0,'#17181d');g.addColorStop(1,'#050506');o.fillStyle=g;o.fillRect(0,0,W,H);
o.lineWidth=3;o.lineCap='round';
for(const[c,a,b,d,e]of S){const l=o.createLinearGradient(0,0,W,0);l.addColorStop(0,c+'00');l.addColorStop(.5,c+'77');l.addColorStop(1,c+'00');o.strokeStyle=l;o.shadowColor=c;o.shadowBlur=18;o.beginPath();o.moveTo(-W*.1,a*H);o.bezierCurveTo(W*.3,b*H,W*.6,d*H,W*1.1,e*H);o.stroke()}}
function rs(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);bg();if(!run)x.drawImage(oc,0,0,W,H)}
rs();addEventListener('resize',rs);
function show(m){mode=m;const t=T[L];
ov.innerHTML=(m?'':PR)+'<h1>'+(m?t.l:t.t)+'</h1><p>'+(m?t.c(caught)+'<br>'+t.r:t.d)+'</p>'+(m?'<div id="lb" class="lb"></div>':'')+'<button id="go">'+(m?t.p:t.s)+'</button>'+(m?'':who());ov.style.display='flex';if(m)lbFill();if(!run&&!idleOn){idleOn=true;requestAnimationFrame(idle)}}
ov.onclick=e=>{if(e.target.id=='go')PL?start():regForm(start);if(e.target.id=='chg'){PL=null;try{localStorage.removeItem('th_player')}catch(_){}show(mode)}};
const GS_URL='',SB_URL='https://ufzhsedfkihbuybxfgfy.supabase.co',SB_KEY='sb_publishable_Xpx7sKguWrzAUIMI-JLreg_dYE1d5qP';
const sb=(fn,body)=>fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,...(SB_KEY.startsWith('eyJ')?{Authorization:'Bearer '+SB_KEY}:{})},body:JSON.stringify(body)});
const GK='catch';
const RT={en:{h:'Join the leaderboard',nm:'Username',em:'Email',c1:'I agree that my username, email and score are stored for the leaderboard and prize draw.',c2:'Send me news about Co Print (optional).',go:'Continue',bad:'Check your username (2-16 characters) and email.',need:'Please tick the first box to continue.',as:'Playing as',ch:'Change',top:'Top players'}};
let PL=null;try{PL=JSON.parse(localStorage.getItem('th_player')||'null')}catch(_){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lbKey=()=>'th_lb_'+GK;
function send(b,n){sb('submit_score',b).then(r=>{if(!r.ok)throw 0}).catch(()=>{if((n||0)<3)setTimeout(()=>send(b,(n||0)+1),3000*((n||0)+1))})}
function post(o){if(SB_URL)send({p_game:o.game,p_name:o.name,p_email:o.email,p_mkt:!!o.mkt,p_score:o.score||0});else if(GS_URL)try{fetch(GS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)}).catch(()=>{})}catch(_){}}
function addScore(s){if(!PL)return;let a=[];try{a=JSON.parse(localStorage.getItem(lbKey())||'[]')}catch(_){}
a.push({n:PL.name,s:s});a.sort((p,q)=>q.s-p.s);a=a.slice(0,10);try{localStorage.setItem(lbKey(),JSON.stringify(a))}catch(_){}
post({type:'score',game:GK,name:PL.name,email:PL.email,mkt:PL.mkt,score:s,ts:Date.now()})}
function lbFill(){let a=[];try{a=JSON.parse(localStorage.getItem(lbKey())||'[]')}catch(_){}
const draw=a=>{const el=document.getElementById('lb');if(el)el.innerHTML='<div style="font-weight:800">'+RT[L].top+'</div>'+a.slice(0,5).map((r,i)=>'<div'+(PL&&r.n==PL.name?' class="me"':'')+'><span>'+(i+1)+'. '+esc(r.n)+'</span><b>'+esc(r.s)+'</b></div>').join('')};
draw(a);if(SB_URL||GS_URL)setTimeout(()=>(SB_URL?sb('get_top',{p_game:GK}):fetch(GS_URL+'?game='+GK+'&t='+Date.now())).then(r=>r.json()).then(d=>{if(!Array.isArray(d))return;if(PL){const m=a.find(r=>r.n==PL.name);if(m){const q=d.find(r=>r.n==PL.name);if(!q)d.push({n:m.n,s:m.s});else if(m.s>q.s)q.s=m.s;d.sort((p,z)=>z.s-p.s)}}draw(d)}).catch(()=>{}),1200)}
function who(){return PL?'<div class="who">'+RT[L].as+' <b>'+esc(PL.name)+'</b> · <a id="chg">'+RT[L].ch+'</a></div>':''}
function regForm(next){const t=RT[L];
ov.innerHTML='<h1>'+t.h+'</h1><form class="f" id="rf" novalidate><input type="text" id="un" maxlength="16" placeholder="'+t.nm+'" autocomplete="nickname"><input type="email" id="ue" placeholder="'+t.em+'" autocomplete="email"><label><input type="checkbox" id="c1"><span>'+t.c1+'</span></label><label><input type="checkbox" id="c2"><span>'+t.c2+'</span></label><div class="er" id="er"></div><button id="sb" type="submit">'+t.go+'</button></form>';
document.getElementById('rf').onsubmit=ev=>{ev.preventDefault();const n=document.getElementById('un').value.trim(),m=document.getElementById('ue').value.trim(),er=document.getElementById('er');
if(n.length<2||n.length>16||!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)){er.textContent=t.bad;return}
if(!document.getElementById('c1').checked){er.textContent=t.need;return}
PL={name:n,email:m,mkt:document.getElementById('c2').checked};
try{localStorage.setItem('th_player',JSON.stringify(PL))}catch(_){}
post({type:'player',game:GK,name:n,email:m,mkt:PL.mkt,ts:Date.now()});next()}}
show(0);
function start(){items=[];caught=0;left=TIME;px=W/2;spawn=0;fl=0;last=performance.now();run=true;ov.style.display='none';sc.textContent='0';requestAnimationFrame(loop)}
function mv(e){const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;if(t&&t.clientX!=null)px=t.clientX}
['touchstart','touchmove'].forEach(n=>addEventListener(n,e=>{mv(e);if(run&&e.cancelable&&!(e.target.closest&&e.target.closest('#bk')))e.preventDefault()},{passive:false}));['pointerdown','pointermove','mousedown','mousemove'].forEach(n=>addEventListener(n,mv));
function rr(c,a,b,w,h,r){c.beginPath();c.roundRect(a,b,w,h,r)}
function head(c,w,h,led,g){c.lineJoin='round';c.lineWidth=Math.max(2.5,w*.07);c.strokeStyle='#fff';
c.fillStyle=g?'rgba(255,201,51,.55)':'rgba(59,108,255,.4)';rr(c,-w/2+w*.09,-h/2+h*.04,w,h,w*.22);c.fill();
c.strokeStyle='#555';c.beginPath();c.moveTo(0,-h/2);c.quadraticCurveTo(w*.6,-h*.65,w*.15,-h*.85);c.stroke();
c.strokeStyle='#fff';c.fillStyle=g?'#ffc933':'#16161a';rr(c,-w/2,-h/2,w,h,w*.22);c.fill();c.stroke();
c.fillStyle='#8a8f99';rr(c,-w*.16,-h*.3,w*.32,h*.045,2);c.fill();
c.fillStyle=led;rr(c,-w*.3,h*.33,w*.6,h*.05,3);c.fill();
c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.beginPath();c.moveTo(-w*.3,-h*.15);c.lineTo(-w*.3,h*.2);c.stroke();if(g){c.fillStyle='#16161a';c.font='bold '+Math.round(w*.42)+'px system-ui';c.textAlign='center';c.fillText('x2',0,h*.18)}}
function loop(n){if(!run)return;const dt=Math.min(.05,(n-last)/1000);last=n;left-=dt;
const iw=Math.min(54,W*.14),ih=iw*1.7,tw=Math.min(120,W*.3)*(1-Math.min(caught,30)*.012),th=16,ty=H-th-40;
spawn-=dt;if(spawn<=0){spawn=.25+Math.random()*.15;const x0=iw/2+Math.random()*(W-iw),tr=Math.random()<.2,go=!tr&&Math.random()<.1;items.push({x:x0,x0:x0,y:-ih*1.3,v:H*(.7+Math.random()*.3)*(1+Math.min(caught,40)*.036)*(go?1.3:1),r:(Math.random()-.5)*.5,t:tr,g:go,a:(go||(!tr&&Math.random()<.4))?W*(.06+Math.random()*.08):0,ph:Math.random()*6,c:LED[Math.floor(Math.random()*4)]})}
x.drawImage(oc,0,0,W,H);glow(n/1000);
for(const it of items){it.y+=it.v*dt;if(it.a)it.x=Math.max(iw/2,Math.min(W-iw/2,it.x0+Math.sin(it.y*.012+it.ph)*it.a));
if(!it.d&&it.y+ih>=ty&&it.y<ty+th&&Math.abs(it.x-px)<tw/2+iw/3){it.d=1;if(it.t){caught=Math.max(0,caught-2);fl=.35;if(navigator.vibrate)navigator.vibrate(80)}else caught+=it.g?2:1;sc.textContent=caught}
if(!it.d){x.save();if(it.t){x.translate(it.x,it.y+ih-iw*.5);x.fillStyle='#e03131';x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(0,0,iw*.5,0,7);x.fill();x.stroke();x.beginPath();x.moveTo(-9,-9);x.lineTo(9,9);x.moveTo(9,-9);x.lineTo(-9,9);x.stroke()}else{x.translate(it.x,it.y+ih/2);x.rotate(it.r);head(x,iw,ih,it.c,it.g)}x.restore()}}
items=items.filter(i=>!i.d&&i.y<H+ih*2);
px=Math.max(tw/2,Math.min(W-tw/2,px));fl-=dt;
x.save();x.shadowColor=fl>0?'#e03131':'#3b6cff';x.shadowBlur=16;x.fillStyle=fl>0?'#f08080':'#d8dbe2';x.strokeStyle='#fff';x.lineWidth=3;rr(x,px-tw/2,ty,tw,th,8);x.fill();x.stroke();x.restore();
x.fillStyle='#9aa0ab';rr(x,px-tw/2+6,ty+th*.55,tw-12,th*.28,3);x.fill();
const s=Math.max(0,Math.ceil(left));tm.textContent=s;tm.className=left<=5?'p r':'p';
if(left<=0){run=false;addScore(caught);return show(1)}
requestAnimationFrame(loop)}
